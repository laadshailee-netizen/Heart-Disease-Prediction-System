<!-- ========================= templates/login.html ========================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>HeartAI - Login</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- BOOTSTRAP -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(
                rgba(0,0,0,0.72),
                rgba(0,0,0,0.72)
            ),

            url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=2072&auto=format&fit=crop');

            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            overflow-x:hidden;
        }

        /* MAIN BOX */

        .auth-box{

            width:100%;
            max-width:450px;

            background:rgba(255,255,255,0.12);

            backdrop-filter:blur(18px);

            border-radius:30px;

            padding:45px 35px;

            box-shadow:0 20px 50px rgba(0,0,0,0.4);

            border:1px solid rgba(255,255,255,0.15);
        }

        /* LOGO */

        .logo{

            text-align:center;

            margin-bottom:35px;
        }

        .logo i{

            font-size:48px;

            color:#60a5fa;

            margin-bottom:12px;
        }

        .logo h1{

            color:white;

            font-size:34px;

            font-weight:800;
        }

        .logo p{

            color:#cbd5e1;

            margin-top:8px;

            font-size:14px;
        }

        /* TABS */

        .tabs{

            display:flex;

            background:rgba(255,255,255,0.08);

            border-radius:14px;

            padding:5px;

            margin-bottom:28px;
        }

        .tab-btn{

            flex:1;

            height:48px;

            border:none;

            border-radius:12px;

            background:transparent;

            color:white;

            font-weight:600;

            transition:0.3s;
        }

        .tab-btn.active{

            background:white;

            color:#2563eb;
        }

        /* ALERT */

        .alert{

            border-radius:12px;

            font-size:14px;
        }

        /* INPUT */

        .input-box{

            position:relative;

            margin-bottom:22px;
        }

        .input-box input{

            width:100%;

            height:58px;

            border:none;

            border-radius:16px;

            background:rgba(255,255,255,0.1);

            color:white;

            padding-left:55px;
            padding-right:55px;

            font-size:15px;

            outline:none;

            border:1px solid rgba(255,255,255,0.15);

            transition:0.3s;
        }

        .input-box input::placeholder{

            color:#cbd5e1;
        }

        .input-box input:focus{

            border-color:#60a5fa;

            background:rgba(255,255,255,0.15);
        }

        .left-icon{

            position:absolute;

            top:20px;
            left:18px;

            color:#cbd5e1;
        }

        .toggle-password{

            position:absolute;

            top:20px;
            right:18px;

            color:#cbd5e1;

            cursor:pointer;
        }

        /* OPTIONS */

        .options{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:25px;

            font-size:14px;

            color:white;
        }

        .options a{

            color:#93c5fd;

            text-decoration:none;
        }

        /* BUTTON */

        .submit-btn{

            width:100%;

            height:58px;

            border:none;

            border-radius:16px;

            background:
            linear-gradient(
                to right,
                #2563eb,
                #1d4ed8
            );

            color:white;

            font-size:16px;

            font-weight:600;

            transition:0.3s;
        }

        .submit-btn:hover{

            transform:translateY(-2px);

            box-shadow:0 10px 25px rgba(37,99,235,0.4);
        }

        /* DIVIDER */

        .divider{

            text-align:center;

            margin:28px 0;

            position:relative;
        }

        .divider::before{

            content:'';

            position:absolute;

            width:100%;
            height:1px;

            background:rgba(255,255,255,0.15);

            top:50%;
            left:0;
        }

        .divider span{

            background:transparent;

            padding:0 14px;

            color:#cbd5e1;

            position:relative;

            font-size:13px;
        }

        /* SOCIAL */

        .social-btn{

            width:100%;

            height:56px;

            border:none;

            border-radius:15px;

            margin-bottom:15px;

            font-weight:600;

            transition:0.3s;
        }

        .social-btn:hover{

            transform:translateY(-2px);
        }

        .google{

            background:white;

            color:#111827;
        }

        .facebook{

            background:#1877f2;

            color:white;
        }

        .social-btn i{

            margin-right:10px;
        }

        /* REGISTER FORM */

        #registerForm{

            display:none;
        }

        /* RESPONSIVE */

        @media(max-width:576px){

            .auth-box{

                padding:35px 22px;
            }

            .logo h1{

                font-size:28px;
            }

            .options{

                flex-direction:column;

                align-items:flex-start;

                gap:10px;
            }
        }

    </style>

</head>

<body>

    <div class="auth-box">

        <!-- LOGO -->

        <div class="logo">

            <i class="fa-solid fa-heart-pulse"></i>

            <h1>HeartAI</h1>

            <p>

                Secure Healthcare Authentication

            </p>

        </div>

        <!-- TABS -->

        <div class="tabs">

            <button class="tab-btn active"
                id="loginTab"
                onclick="showLogin()">

                Login

            </button>

            <button class="tab-btn"
                id="registerTab"
                onclick="showRegister()">

                Register

            </button>

        </div>

        <!-- FLASH -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <!-- LOGIN FORM -->

        <form action="/user_login"
            method="POST"
            id="loginForm">

            <div class="input-box">

                <i class="fa-solid fa-user left-icon"></i>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock left-icon"></i>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter Password"
                    required>

                <i class="fa-solid fa-eye toggle-password"
                    onclick="togglePassword('loginPassword')"></i>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button type="submit"
                class="submit-btn">

                Login Account

            </button>

        </form>

        <!-- REGISTER FORM -->

        <form action="/create_account"
            method="POST"
            id="registerForm">

            <div class="input-box">

                <i class="fa-solid fa-user left-icon"></i>

                <input
                    type="text"
                    name="username"
                    placeholder="Create Username"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope left-icon"></i>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter Email"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock left-icon"></i>

                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    placeholder="Create Password"
                    required>

                <i class="fa-solid fa-eye toggle-password"
                    onclick="togglePassword('registerPassword')"></i>

            </div>

            <button type="submit"
                class="submit-btn">

                Create Account

            </button>

        </form>

        <!-- DIVIDER -->

        <div class="divider">

            <span>OR CONTINUE WITH</span>

        </div>

        <!-- GOOGLE -->

        <button class="social-btn google"
            onclick="googleLogin()">

            <i class="fa-brands fa-google"></i>

            Continue with Google

        </button>

        <!-- FACEBOOK -->

        <button class="social-btn facebook"
            onclick="facebookLogin()">

            <i class="fa-brands fa-facebook-f"></i>

            Continue with Facebook

        </button>

    </div>

    <!-- JAVASCRIPT -->

    <script>

        // LOGIN TAB

        function showLogin(){

            document.getElementById("loginForm")
            .style.display = "block";

            document.getElementById("registerForm")
            .style.display = "none";

            document.getElementById("loginTab")
            .classList.add("active");

            document.getElementById("registerTab")
            .classList.remove("active");
        }

        // REGISTER TAB

        function showRegister(){

            document.getElementById("loginForm")
            .style.display = "none";

            document.getElementById("registerForm")
            .style.display = "block";

            document.getElementById("registerTab")
            .classList.add("active");

            document.getElementById("loginTab")
            .classList.remove("active");
        }

        // PASSWORD TOGGLE

        function togglePassword(id){

            let input =
                document.getElementById(id);

            if(input.type === "password"){

                input.type = "text";

            }

            else{

                input.type = "password";
            }
        }

        // GOOGLE LOGIN

        function googleLogin(){

            window.location.href =
            "https://accounts.google.com/";
        }

        // FACEBOOK LOGIN

        function facebookLogin(){

            window.location.href =
            "https://www.facebook.com/login/";
        }

    </script>

</body>

</html>
