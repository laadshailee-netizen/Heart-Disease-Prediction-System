<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
body{
    background:#0f172a;
    font-family:Arial;
}
.login-box{
    width:400px;
    margin:auto;
    margin-top:100px;
    background:#1e293b;
    padding:35px;
    border-radius:20px;
    color:white;
}
h1{
    text-align:center;
    margin-bottom:25px;
    color:#38bdf8;
}
input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
}
button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#1d4ed8;
}
.error{
    background:#dc3545;
    padding:12px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px;
}
</style>
</head>
<body>
<div class="login-box">
    <h1>🔐 Admin Login</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="error">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <form action="/admin_login" method="POST">
        <input type="text" name="username" placeholder="Admin Username" required>
        <input type="password" name="password" placeholder="Admin Password" required>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
