<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f0f2f5;
            padding:20px;
        }

        .container{
            max-width:1100px;
            margin:auto;
        }

        /* ================= HEADER ================= */

        .header{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1{
            color:#0066cc;
            font-size:28px;
        }

        .btn-group{
            display:flex;
            gap:10px;
        }

        .btn{
            text-decoration:none;
            padding:10px 18px;
            border-radius:6px;
            color:white;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            opacity:0.9;
        }

        .admin-btn{
            background:#0066cc;
        }

        .logout-btn{
            background:#dc3545;
        }

        /* ================= STATS ================= */

        .stats{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            margin-bottom:20px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3{
            color:#555;
            margin-bottom:10px;
            font-size:16px;
        }

        .number{
            font-size:35px;
            font-weight:bold;
        }

        .blue{
            color:#0066cc;
        }

        .red{
            color:#dc3545;
        }

        .green{
            color:#28a745;
        }

        /* ================= CHARTS ================= */

        .charts{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .chart-box{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .chart-box h3{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        canvas{
            width:100% !important;
            height:350px !important;
        }

        /* ================= MOBILE ================= */

        @media(max-width:768px){

            .header{
                flex-direction:column;
                gap:15px;
                text-align:center;
            }

            .stats{
                grid-template-columns:1fr;
            }

            .charts{
                grid-template-columns:1fr;
            }

            .btn-group{
                width:100%;
                justify-content:center;
                flex-wrap:wrap;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- ================= HEADER ================= -->

        <div class="header">

            <h1>Analytics Dashboard</h1>

            <div class="btn-group">
                <a href="/admin_panel" class="btn admin-btn">
                    Admin Panel
                </a>

                <a href="/logout" class="btn logout-btn">
                    Logout
                </a>
            </div>

        </div>

        <!-- ================= STATS ================= -->

        <div class="stats">

            <div class="card">
                <h3>Total Patients</h3>
                <div class="number blue">
                    {{ total }}
                </div>
            </div>

            <div class="card">
                <h3>High Risk Patients</h3>
                <div class="number red">
                    {{ high }}
                </div>
            </div>

            <div class="card">
                <h3>Low Risk Patients</h3>
                <div class="number green">
                    {{ low }}
                </div>
            </div>

        </div>

        <!-- ================= CHARTS ================= -->

        <div class="charts">

            <div class="chart-box">

                <h3>Risk Distribution</h3>

                <canvas id="pieChart"></canvas>

            </div>

            <div class="chart-box">

                <h3>Risk Comparison</h3>

                <canvas id="barChart"></canvas>

            </div>

        </div>

    </div>

    <!-- ================= CHART SCRIPT ================= -->

    <script>

        let totalPatients = Number("{{ total }}");
        let highRisk = Number("{{ high }}");
        let lowRisk = Number("{{ low }}");

        /* ================= PIE CHART ================= */

        new Chart(document.getElementById('pieChart'), {

            type: 'doughnut',

            data: {

                labels: ['High Risk', 'Low Risk'],

                datasets: [{

                    data: [highRisk, lowRisk],

                    backgroundColor: [
                        '#dc3545',
                        '#28a745'
                    ],

                    borderWidth: 2

                }]
            },

            options: {

                responsive: true,

                plugins: {

                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });

        /* ================= BAR CHART ================= */

        new Chart(document.getElementById('barChart'), {

            type: 'bar',

            data: {

                labels: [
                    'High Risk',
                    'Low Risk',
                    'Total'
                ],

                datasets: [{

                    label: 'Patients',

                    data: [
                        highRisk,
                        lowRisk,
                        totalPatients
                    ],

                    backgroundColor: [
                        '#dc3545',
                        '#28a745',
                        '#0066cc'
                    ],

                    borderRadius: 8
                }]
            },

            options: {

                responsive: true,

                scales: {

                    y: {
                        beginAtZero: true
                    }
                },

                plugins: {

                    legend: {
                        display: false
                    }
                }
            }
        });

    </script>

</body>
</html>
