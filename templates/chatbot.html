<!DOCTYPE html>
<html>
<head>
    <title>AI Voice Assistant</title>

    <style>

        body{
            font-family: Arial;
            background:#0b1f3a;
            color:white;
            text-align:center;
            padding-top:50px;
        }

        .box{
            width:400px;
            margin:auto;
            padding:30px;
            border-radius:20px;
            background:#132b50;
        }

        button{
            width:100%;
            padding:15px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            background:cyan;
            color:black;
            font-size:18px;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            font-size:20px;
        }

    </style>
</head>

<body>

<div class="box">

    <h1>AI Voice Assistant</h1>

    <button onclick="startListening()">
        🎤 Start Speaking
    </button>

    <div id="result"></div>

</div>

<script>

function speak(text){

    let speech = new SpeechSynthesisUtterance();

    speech.text = text;

    speech.lang = "en-US";

    window.speechSynthesis.speak(speech);
}

function startListening(){

    const recognition =
    new webkitSpeechRecognition();

    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event){

        let text =
        event.results[0][0].transcript;

        document.getElementById(
        "result").innerHTML =
        "You Said : " + text;

        let reply = "";

        text = text.toLowerCase();

        if(text.includes("hello")){
            reply = "Hello, how can I help you";
        }

        else if(text.includes("heart")){
            reply =
            "Heart disease risk depends on blood pressure cholesterol and lifestyle";
        }

        else if(text.includes("diet")){
            reply =
            "Eat healthy food avoid oily food and exercise daily";
        }

        else{
            reply =
            "Sorry I did not understand";
        }

        document.getElementById(
        "result").innerHTML +=
        "<br><br>Assistant : " + reply;

        speak(reply);
    };

}

</script>

</body>
</html>
