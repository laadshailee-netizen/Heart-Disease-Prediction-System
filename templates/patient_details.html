<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | Heart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .reg-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            transition: transform 0.3s ease;
        }
        .reg-card:hover {
            transform: translateY(-5px);
        }
        .icon-header {
            font-size: 50px;
            color: #764ba2;
            margin-bottom: 15px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            margin-bottom: 5px;
        }
        .form-control:focus {
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.2);
            border-color: #764ba2;
        }
        .btn-next {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-next:hover {
            background: #5a397a;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        label {
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
        }
        .input-group-text {
            background: #f8f9fa;
            border-radius: 10px 0 0 10px;
            color: #764ba2;
        }
        .form-control-with-icon {
            border-radius: 0 10px 10px 0 !important;
        }
    </style>
</head>
<body>

<div class="reg-card text-center">
    <div class="icon-header">
        <i class="fas fa-user-circle"></i>
    </div>
    <h2 class="fw-bold mb-2">Patient Details</h2>
    <p class="text-muted mb-4">Please enter patient information to begin analysis.</p>

    <form action="/dashboard" method="POST" class="text-start">
        <div class="mb-3">
            <label><i class="fas fa-user me-2"></i>Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-signature"></i></span>
                <input type="text" name="name" class="form-control form-control-with-icon" placeholder="e.g. Shaili Lord" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label><i class="fas fa-calendar-alt me-2"></i>Age</label>
                <input type="number" name="age" class="form-control" placeholder="Years" required min="1" max="120">
            </div>
            <div class="col-md-6 mb-3">
                <label><i class="fas fa-map-marker-alt me-2"></i>City</label>
                <input type="text" name="city" class="form-control" placeholder="City Name" required>
            </div>
        </div>

        <div class="mb-4">
            <label><i class="fas fa-phone me-2"></i>Phone Number</label>
            <div class="input-group">
                <span class="input-group-text">+91</span>
                <input type="tel" name="phone" class="form-control form-control-with-icon" placeholder="10-digit number" required pattern="[0-9]{10}">
            </div>
        </div>

        <button type="submit" class="btn btn-next w-100 mt-2">
            Proceed to Medical Form <i class="fas fa-arrow-right ms-2"></i>
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
